name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios | head -5

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          set +e
          xcodebuild \
            -project ClawdIsland.xcodeproj \
            -scheme ClawdIsland \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          rc=$?
          echo "xcodebuild 退出码: $rc"
          echo "=== 日志尾部 ==="
          tail -30 build.log
          if [ $rc -ne 0 ]; then
            echo "=== 编译错误（去重）==="
            grep -E "error: " build.log | sort -u | head -80
            exit $rc
          fi
          echo "=== 警告（去重，仅记录）==="
          grep -E "warning: " build.log | sort -u | head -20

      - name: 打包未签名 ipa
        if: success()
        run: |
          APP=build/Build/Products/Debug-iphoneos/ClawdIsland.app
          ls -la "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ClawdIsland-unsigned.ipa
          ls -lh ClawdIsland-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ClawdIsland-unsigned-ipa
          path: ClawdIsland-unsigned.ipa
          retention-days: 14
