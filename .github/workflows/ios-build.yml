name: iOS Build + 功能截图

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          echo "=== 可用模拟器 ==="
          xcrun simctl list devices available | head -30

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 真机编译（不签名）
        run: |
          set +e
          xcodebuild -project ClawdIsland.xcodeproj -scheme ClawdIsland -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          rc=$?
          echo "xcodebuild 退出码: $rc"
          tail -20 build.log
          if [ $rc -ne 0 ]; then grep -E "error: " build.log | sort -u | head -60; exit $rc; fi
          grep -E "warning: " build.log | sort -u | head -20

      - name: 打包未签名 ipa
        run: |
          APP=build/Build/Products/Debug-iphoneos/ClawdIsland.app
          mkdir -p Payload && cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ClawdIsland-unsigned.ipa
          ls -lh ClawdIsland-unsigned.ipa

      - name: 挑一台刘海机型模拟器
        id: sim
        run: |
          set -e
          LIST=$(xcrun simctl list devices available)
          for NAME in "iPhone 16e" "iPhone 16 Plus" "iPhone 14" "iPhone 13" "iPhone SE (3rd generation)"; do
            LINE=$(echo "$LIST" | grep -m1 -F "$NAME (" || true)
            if [ -n "$LINE" ]; then
              UDID=$(echo "$LINE" | sed -n 's/.*(\([0-9A-F-]\{36\}\)).*/\1/p' | head -1)
              if [ -n "$UDID" ]; then
                echo "选中: $NAME ($UDID)"
                echo "device=$UDID" >> "$GITHUB_OUTPUT"
                echo "name=$NAME" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          done
          LINE=$(echo "$LIST" | grep -m1 "iPhone " || true)
          UDID=$(echo "$LINE" | sed -n 's/.*(\([0-9A-F-]\{36\}\)).*/\1/p' | head -1)
          echo "device=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=fallback" >> "$GITHUB_OUTPUT"

      - name: 启动模拟器
        run: |
          D="${{ steps.sim.outputs.device }}"
          xcrun simctl boot "$D" || true
          xcrun simctl bootstatus "$D" -b

      # ---------- 功能 1：状态页（空态）+ 功能 2：外部推送驱动 ----------
      - name: 编译模拟器版并截图「状态页」
        run: |
          set -e
          D="${{ steps.sim.outputs.device }}"
          xcodebuild -project ClawdIsland.xcodeproj -scheme ClawdIsland -configuration Debug \
            -destination "id=$D" -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-sim.log 2>&1
          tail -8 build-sim.log
          xcrun simctl install "$D" build-sim/Build/Products/Debug-iphonesimulator/ClawdIsland.app
          xcrun simctl launch "$D" com.clawd.island || echo "launch 失败"
          sleep 14
          xcrun simctl io "$D" screenshot shot-1-status-empty.png
          ls -lh shot-1-status-empty.png

      - name: 功能 2 —— 从外部推一条状态（WORKING / PreToolUse）
        run: |
          set -e
          D="${{ steps.sim.outputs.device }}"
          echo "=== 先看 payload ==="
          python3 tools/send_state.py --dry-run --state working --event PreToolUse \
            --session-title "重构支付模块" --tool-name "Bash"
          echo "=== 真推 ==="
          python3 tools/send_state.py --host 127.0.0.1 --state working --event PreToolUse \
            --agent-id openclaw --hook-source send_state.py \
            --session-id sess-ci-0001 --session-title "重构支付模块" \
            --cwd "/Users/dev/pay" --tool-name "Bash" --tool-use-id toolu_ci_0001
          sleep 6
          echo "=== 再推一条（PostToolUse，会话继续）==="
          python3 tools/send_state.py --host 127.0.0.1 --state working --event PostToolUse \
            --agent-id openclaw --hook-source send_state.py \
            --session-id sess-ci-0001 --session-title "重构支付模块" \
            --cwd "/Users/dev/pay" --tool-name "Bash" --tool-use-id toolu_ci_0001 || echo "推送失败（不影响截图）"
          sleep 8
          xcrun simctl io "$D" screenshot shot-2-status-pushed.png
          ls -lh shot-2-status-pushed.png

      - name: 功能 3 —— 截图「刘海」页（只改 CI 里的那份源码的初始 tab）
        run: |
          set -e
          D="${{ steps.sim.outputs.device }}"
          python3 - <<'PY'
          p = "App/ContentView.swift"
          s = open(p, encoding="utf-8").read()
          assert "@State private var selection = 0" in s, "找不到 selection 锚点"
          open(p, "w", encoding="utf-8").write(
              s.replace("@State private var selection = 0",
                        "@State private var selection = 1", 1))
          print("已把初始 tab 改成 1（刘海）")
          PY
          xcodebuild -project ClawdIsland.xcodeproj -scheme ClawdIsland -configuration Debug \
            -destination "id=$D" -derivedDataPath build-sim-notch \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-sim-notch.log 2>&1
          tail -6 build-sim-notch.log
          xcrun simctl terminate "$D" com.clawd.island || true
          xcrun simctl install "$D" build-sim-notch/Build/Products/Debug-iphonesimulator/ClawdIsland.app
          xcrun simctl launch "$D" com.clawd.island || echo "launch 失败"
          sleep 14
          xcrun simctl io "$D" screenshot shot-3-notch.png
          ls -lh shot-3-notch.png

      - name: 功能 4 —— 截图「设置」页
        run: |
          set -e
          D="${{ steps.sim.outputs.device }}"
          python3 - <<'PY'
          p = "App/ContentView.swift"
          s = open(p, encoding="utf-8").read()
          assert "@State private var selection = 1" in s, "找不到 selection 锚点"
          open(p, "w", encoding="utf-8").write(
              s.replace("@State private var selection = 1",
                        "@State private var selection = 2", 1))
          print("已把初始 tab 改成 2（设置）")
          PY
          xcodebuild -project ClawdIsland.xcodeproj -scheme ClawdIsland -configuration Debug \
            -destination "id=$D" -derivedDataPath build-sim-set \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-sim-set.log 2>&1
          tail -6 build-sim-set.log
          xcrun simctl terminate "$D" com.clawd.island || true
          xcrun simctl install "$D" build-sim-set/Build/Products/Debug-iphonesimulator/ClawdIsland.app
          xcrun simctl launch "$D" com.clawd.island || echo "launch 失败"
          sleep 14
          xcrun simctl io "$D" screenshot shot-4-settings.png
          ls -lh shot-4-settings.png

      - name: 失败时抓崩溃日志
        if: failure()
        run: |
          find ~/Library/Logs/DiagnosticReports -name "*.ips" -newermt "-15 minutes" 2>/dev/null | head -5 | while read f; do
            echo "===== $f"; head -80 "$f"
          done || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: "*.png"
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            build-sim.log
            build-sim-notch.log
            build-sim-set.log
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ClawdIsland-unsigned-ipa
          path: ClawdIsland-unsigned.ipa
          retention-days: 14
