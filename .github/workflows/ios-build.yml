name: iOS Build + 功能截图

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          echo "=== 可用模拟器 ==="
          xcrun simctl list devices available | head -30

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 真机编译（不签名）
        run: |
          set +e
          xcodebuild -project ClawdIsland.xcodeproj -scheme ClawdIsland -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          rc=$?
          echo "xcodebuild 退出码: $rc"
          tail -20 build.log
          if [ $rc -ne 0 ]; then grep -E "error: " build.log | sort -u | head -60; exit $rc; fi
          grep -E "warning: " build.log | sort -u | head -20

      - name: 打包未签名 ipa
        run: |
          APP=build/Build/Products/Debug-iphoneos/ClawdIsland.app
          mkdir -p Payload && cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ClawdIsland-unsigned.ipa
          ls -lh ClawdIsland-unsigned.ipa

      - name: 挑一台刘海机型模拟器
        id: sim
        run: |
          set -e
          LIST=$(xcrun simctl list devices available)
          for NAME in "iPhone 16e" "iPhone 16 Plus" "iPhone 14" "iPhone 13" "iPhone SE (3rd generation)"; do
            LINE=$(echo "$LIST" | grep -m1 -F "$NAME (" || true)
            if [ -n "$LINE" ]; then
              UDID=$(echo "$LINE" | sed -n 's/.*(\([0-9A-F-]\{36\}\)).*/\1/p' | head -1)
              if [ -n "$UDID" ]; then
                echo "选中: $NAME ($UDID)"
                echo "device=$UDID" >> "$GITHUB_OUTPUT"
                echo "name=$NAME" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          done
          LINE=$(echo "$LIST" | grep -m1 "iPhone " || true)
          UDID=$(echo "$LINE" | sed -n 's/.*(\([0-9A-F-]\{36\}\)).*/\1/p' | head -1)
          echo "device=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=fallback" >> "$GITHUB_OUTPUT"

      - name: 启动模拟器
        run: |
          D="${{ steps.sim.outputs.device }}"
          xcrun simctl boot "$D" || true
          xcrun simctl bootstatus "$D" -b

      # ---------- 功能 1：状态页（空态）+ 功能 2：外部推送驱动 ----------
      - name: 编译模拟器版并截图「状态页」
        run: |
          set -e
          D="${{ steps.sim.outputs.device }}"
          xcodebuild -project ClawdIsland.xcodeproj -scheme ClawdIsland -configuration Debug \
            -destination "id=$D" -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-sim.log 2>&1
          tail -8 build-sim.log
          xcrun simctl install "$D" build-sim/Build/Products/Debug-iphonesimulator/ClawdIsland.app
          CONT=$(xcrun simctl get_app_container "$D" com.clawd.island data)
          M="$CONT/Documents/frame.txt"
          rm -f "$M"
          # 这张图自称是「状态页」（tab=0），就让 App 自己说它渲染的是哪个 tab。
          # 原来只 sleep 14 秒就拍：启动崩了、或渲染停在别的页，拍成主屏也是绿的。
          # launch 失败也不再吞掉 —— 吞了以后错的是图、绿的是 job。
          SIMCTL_CHILD_CLAWD_FRAME_MARKER=1 xcrun simctl launch "$D" com.clawd.island \
            || { echo "app 起不来，下面这张图没有意义"; exit 1; }
          i=0
          while [ "$i" -lt 40 ]; do
            if [ -s "$M" ]; then break; fi
            sleep 1
            i=$((i + 1))
          done
          grep -q "^FRAME READY tab=0$" "$M" \
            || { echo "首帧标记不对，拍的这张图不可信：$(cat "$M" 2>/dev/null || echo 标记没写出来)"; exit 1; }
          sleep 14
          xcrun simctl io "$D" screenshot shot-1-status-empty.png
          ls -lh shot-1-status-empty.png

      - name: 功能 2 —— 从外部推一条状态（WORKING / PreToolUse）
        run: |
          set -e
          D="${{ steps.sim.outputs.device }}"
          echo "=== 先看 payload ==="
          python3 tools/send_state.py --dry-run --state working --event PreToolUse \
            --session-title "重构支付模块" --tool-name "Bash"
          echo "=== 真推 ==="
          python3 tools/send_state.py --host 127.0.0.1 --state working --event PreToolUse \
            --agent-id openclaw --hook-source send_state.py \
            --session-id sess-ci-0001 --session-title "重构支付模块" \
            --cwd "/Users/dev/pay" --tool-name "Bash" --tool-use-id toolu_ci_0001
          sleep 6
          echo "=== 再推一条（PostToolUse，会话继续）==="
          python3 tools/send_state.py --host 127.0.0.1 --state working --event PostToolUse \
            --agent-id openclaw --hook-source send_state.py \
            --session-id sess-ci-0001 --session-title "重构支付模块" \
            --cwd "/Users/dev/pay" --tool-name "Bash" --tool-use-id toolu_ci_0001 || echo "推送失败（不影响截图）"
          sleep 8
          xcrun simctl io "$D" screenshot shot-2-status-pushed.png
          ls -lh shot-2-status-pushed.png

      - name: 功能 3 —— 截图「刘海」页（只改 CI 里的那份源码的初始 tab）
        run: |
          set -e
          D="${{ steps.sim.outputs.device }}"
          python3 - <<'PY'
          p = "App/ContentView.swift"
          s = open(p, encoding="utf-8").read()
          assert "@State private var selection = 0" in s, "找不到 selection 锚点"
          open(p, "w", encoding="utf-8").write(
              s.replace("@State private var selection = 0",
                        "@State private var selection = 1", 1))
          print("已把初始 tab 改成 1（刘海）")
          PY
          xcodebuild -project ClawdIsland.xcodeproj -scheme ClawdIsland -configuration Debug \
            -destination "id=$D" -derivedDataPath build-sim-notch \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-sim-notch.log 2>&1
          tail -6 build-sim-notch.log
          xcrun simctl terminate "$D" com.clawd.island || true
          xcrun simctl install "$D" build-sim-notch/Build/Products/Debug-iphonesimulator/ClawdIsland.app
          CONT=$(xcrun simctl get_app_container "$D" com.clawd.island data)
          M="$CONT/Documents/frame.txt"
          rm -f "$M"
          # 这张图自称是「刘海页」（tab=1），就让 App 自己说它渲染的是哪个 tab。
          # 原来只 sleep 14 秒就拍：启动崩了、或渲染停在别的页，拍成主屏也是绿的。
          # launch 失败也不再吞掉 —— 吞了以后错的是图、绿的是 job。
          SIMCTL_CHILD_CLAWD_FRAME_MARKER=1 xcrun simctl launch "$D" com.clawd.island \
            || { echo "app 起不来，下面这张图没有意义"; exit 1; }
          i=0
          while [ "$i" -lt 40 ]; do
            if [ -s "$M" ]; then break; fi
            sleep 1
            i=$((i + 1))
          done
          grep -q "^FRAME READY tab=1$" "$M" \
            || { echo "首帧标记不对，拍的这张图不可信：$(cat "$M" 2>/dev/null || echo 标记没写出来)"; exit 1; }
          sleep 14
          xcrun simctl io "$D" screenshot shot-3-notch.png
          ls -lh shot-3-notch.png

      - name: 功能 4 —— 截图「设置」页
        run: |
          set -e
          D="${{ steps.sim.outputs.device }}"
          python3 - <<'PY'
          p = "App/ContentView.swift"
          s = open(p, encoding="utf-8").read()
          assert "@State private var selection = 1" in s, "找不到 selection 锚点"
          open(p, "w", encoding="utf-8").write(
              s.replace("@State private var selection = 1",
                        "@State private var selection = 2", 1))
          print("已把初始 tab 改成 2（设置）")
          PY
          xcodebuild -project ClawdIsland.xcodeproj -scheme ClawdIsland -configuration Debug \
            -destination "id=$D" -derivedDataPath build-sim-set \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-sim-set.log 2>&1
          tail -6 build-sim-set.log
          xcrun simctl terminate "$D" com.clawd.island || true
          xcrun simctl install "$D" build-sim-set/Build/Products/Debug-iphonesimulator/ClawdIsland.app
          CONT=$(xcrun simctl get_app_container "$D" com.clawd.island data)
          M="$CONT/Documents/frame.txt"
          rm -f "$M"
          # 这张图自称是「设置页」（tab=2），就让 App 自己说它渲染的是哪个 tab。
          # 原来只 sleep 14 秒就拍：启动崩了、或渲染停在别的页，拍成主屏也是绿的。
          # launch 失败也不再吞掉 —— 吞了以后错的是图、绿的是 job。
          SIMCTL_CHILD_CLAWD_FRAME_MARKER=1 xcrun simctl launch "$D" com.clawd.island \
            || { echo "app 起不来，下面这张图没有意义"; exit 1; }
          i=0
          while [ "$i" -lt 40 ]; do
            if [ -s "$M" ]; then break; fi
            sleep 1
            i=$((i + 1))
          done
          grep -q "^FRAME READY tab=2$" "$M" \
            || { echo "首帧标记不对，拍的这张图不可信：$(cat "$M" 2>/dev/null || echo 标记没写出来)"; exit 1; }
          sleep 14
          xcrun simctl io "$D" screenshot shot-4-settings.png
          ls -lh shot-4-settings.png

      - name: 功能 5 —— 截图「键盘」预览页（键盘扩展那块视图原样跑在 App 里）
        run: |
          set -e
          D="${{ steps.sim.outputs.device }}"
          python3 - <<'PY'
          p = "App/ContentView.swift"
          s = open(p, encoding="utf-8").read()
          assert "@State private var selection = 2" in s, "找不到 selection 锚点"
          open(p, "w", encoding="utf-8").write(
              s.replace("@State private var selection = 2",
                        "@State private var selection = 3", 1))
          print("已把初始 tab 改成 3（键盘）")
          PY
          xcodebuild -project ClawdIsland.xcodeproj -scheme ClawdIsland -configuration Debug \
            -destination "id=$D" -derivedDataPath build-sim-kb \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-sim-kb.log 2>&1
          tail -6 build-sim-kb.log
          echo "=== 确认键盘扩展被打进了 App ==="
          ls -d build-sim-kb/Build/Products/Debug-iphonesimulator/ClawdIsland.app/PlugIns/*.appex || echo "没有 appex"
          plutil -p build-sim-kb/Build/Products/Debug-iphonesimulator/ClawdIsland.app/PlugIns/ClawdKeyboard.appex/Info.plist 2>/dev/null | grep -i -A2 NSExtensionPointIdentifier || true
          xcrun simctl terminate "$D" com.clawd.island || true
          xcrun simctl install "$D" build-sim-kb/Build/Products/Debug-iphonesimulator/ClawdIsland.app
          CONT=$(xcrun simctl get_app_container "$D" com.clawd.island data)
          M="$CONT/Documents/frame.txt"
          rm -f "$M"
          # 这张图自称是「键盘预览页」（tab=3），就让 App 自己说它渲染的是哪个 tab。
          # 原来只 sleep 16 秒就拍：启动崩了、或渲染停在别的页，拍成主屏也是绿的。
          # launch 失败也不再吞掉 —— 吞了以后错的是图、绿的是 job。
          SIMCTL_CHILD_CLAWD_FRAME_MARKER=1 xcrun simctl launch "$D" com.clawd.island \
            || { echo "app 起不来，下面这张图没有意义"; exit 1; }
          i=0
          while [ "$i" -lt 40 ]; do
            if [ -s "$M" ]; then break; fi
            sleep 1
            i=$((i + 1))
          done
          grep -q "^FRAME READY tab=3$" "$M" \
            || { echo "首帧标记不对，拍的这张图不可信：$(cat "$M" 2>/dev/null || echo 标记没写出来)"; exit 1; }
          sleep 16
          xcrun simctl io "$D" screenshot shot-5-keyboard.png
          ls -lh shot-5-keyboard.png

      - name: 功能 6 —— 表情页两张 + 自检（真的点一次第四行的表情键）
        run: |
          set -e
          D="${{ steps.sim.outputs.device }}"
          # 补上一轮的漏：CI 只截字母页的静止画面，simctl 也没有 tap 命令，
          # 所以「点表情键」那条路径从来没被跑过 —— 真机上每次点都崩，CI 却是绿的。
          # 自检会真的走一遍那段代码，走完停在表情页，正好把这两版都截下来
          # （底行 4 颗带地球 / 3 颗不带）。
          # 复用 build-sim-kb 那份产物：自检是运行时环境变量控制的，不用重编。
          xcrun simctl terminate "$D" com.clawd.island || true
          # install 不清 data 容器：本机复跑时上一轮那份 selftest.txt 会留在原地，
          # 这次就算没写出来也会被 grep 判成通过 —— 跟假绿灯是同一类毛病
          xcrun simctl uninstall "$D" com.clawd.island || true
          xcrun simctl install "$D" build-sim-kb/Build/Products/Debug-iphonesimulator/ClawdIsland.app
          # install 之后容器路径就能查了，不用等 launch。uninstall 那道闸万一没生效
          # （模拟器服务抽风、app 被占着），旧文件会留下来给这次顶包，所以再删一次
          CONT=$(xcrun simctl get_app_container "$D" com.clawd.island data)
          F="$CONT/Documents/selftest.txt"
          GO="$CONT/Documents/selftest-go2"
          rm -f "$F" "$GO"
          SIMCTL_CHILD_CLAWD_KB_SELFTEST=1 xcrun simctl launch "$D" com.clawd.island || echo "launch 失败"
          # 截图钩在证据上，不钩在秒数上：文件是在 rebuild() 之后才写的，
          # 「文件里有这一行」就等于「屏上已经是那一版」。原来是 sleep 6 / sleep 16，
          # 首帧要是慢过 4.5 秒，shot-6 拍到的就是字母页，而两行都在、VERDICT
          # PASS、job 照样绿 —— 图拍错了没人知道。等不到就直接红。
          wait_line() {  # $1=整行前缀  $2=最多等几秒  $3=这一步在等什么
            # 纯 POSIX 写法，不用 seq —— macOS runner 是 BSD 系，
            # 别为一个循环栽在工具链上
            i=0
            while [ "$i" -lt "$2" ]; do
              if grep -q "$1" "$F" 2>/dev/null; then return 0; fi
              sleep 1
              i=$((i + 1))
            done
            echo "等不到「$3」（$1）—— 自检没跑到，或点表情键又越界崩了"
            exit 1
          }
          wait_line "^SELFTEST OK " 60 "第一段：点表情键切到表情页"
          sleep 2
          xcrun simctl io "$D" screenshot shot-6-keyboard-emoji.png
          # 第二段由这个文件触发，不靠秒数 —— 这样 shot-6 必然是「第二段之前」那一版。
          # 上一版用 10 秒计时器，第一次写盘慢了（全新安装时 Documents 还没建出来），
          # 文件是第二段写的时候才带着三行一起出现的，CI 把「等第一行」等成了
          # 「等第三行」，两张图一模一样而 job 照样绿。信号握手堵的就是这条。
          mkdir -p "$CONT/Documents"
          touch "$GO"
          wait_line "^SELFTEST VERDICT " 40 "第二段：关掉地球后的终判"
          sleep 2
          xcrun simctl io "$D" screenshot shot-7-keyboard-emoji-noglobe.png
          ls -lh shot-6-keyboard-emoji.png shot-7-keyboard-emoji-noglobe.png
          echo "=== 自检结果 ==="
          cat "$F" || { echo "自检结果文件没写出来（多半是点表情键又越界崩了）"; exit 1; }
          # 判定收紧到整行。原来只 grep 子串，而 OK2 那行无论 verdict 是什么
          # 都含「SELFTEST OK」，等于那条打磨的验证永远不会红
          if grep -q "^SELFTEST FAIL" "$F"; then echo "自检报了 FAIL"; exit 1; fi
          grep -q "^SELFTEST VERDICT PASS$" "$F" || { echo "自检没给出 PASS 终判"; exit 1; }

      - name: 功能 7 —— 灵动岛实时活动（另开一台灵动岛机型）
        run: |
          set -e
          # 前面几台都特意选刘海机（NotchGeometry 要），灵动岛得另找一台。
          LIST=$(xcrun simctl list devices available)
          DI=""
          for NAME in "iPhone 16 Pro" "iPhone 15 Pro" "iPhone 16 Pro Max" "iPhone 15 Pro Max"; do
            LINE=$(echo "$LIST" | grep -m1 "$NAME (" || true)
            if [ -n "$LINE" ]; then
              DI=$(echo "$LINE" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
              echo "灵动岛机型：$NAME -> $DI"
              break
            fi
          done
          if [ -z "$DI" ]; then echo "runner 上没有灵动岛机型，这步验不了"; exit 1; fi
          xcrun simctl boot "$DI" || true
          xcrun simctl bootstatus "$DI" -b
          xcrun simctl uninstall "$DI" com.clawd.island || true
          xcrun simctl install "$DI" build-sim-kb/Build/Products/Debug-iphonesimulator/ClawdIsland.app
          CONT=$(xcrun simctl get_app_container "$DI" com.clawd.island data)
          M="$CONT/Documents/live-activity.txt"
          rm -f "$M"
          SIMCTL_CHILD_CLAWD_LA_MARKER=1 xcrun simctl launch "$DI" com.clawd.island || echo "launch 失败"
          # 实时活动起没起来由 App 写出来，不靠看图猜。等不到就是没起来，直接红。
          i=0
          while [ "$i" -lt 40 ]; do
            if [ -s "$M" ]; then break; fi
            sleep 1
            i=$((i + 1))
          done
          echo "=== 实时活动标记 ==="
          cat "$M" || { echo "标记没写出来：App 没起，或 Activity.request 卡住了"; exit 1; }
          grep -q "^LIVEACTIVITY ACTIVE" "$M" || { echo "实时活动没起来，灵动岛上不会有东西"; exit 1; }
          # 推一条「干活中」，让岛上显示的是有内容的状态而不是默认空态
          python3 tools/send_state.py --host 127.0.0.1 --state working --event PreToolUse \
            --agent-id openclaw --hook-source send_state.py \
            --session-id sess-ci-la --session-title "重构支付模块" \
            --cwd "/Users/dev/pay" --tool-name "Bash" --tool-use-id toolu_ci_la || echo "推送失败（不影响截图）"
          sleep 5
          # 把 App 送到后台，灵动岛才会显示实时活动的紧凑态（前台时岛上不显示自己的活动）
          xcrun simctl launch "$DI" com.apple.Preferences || echo "切后台失败"
          sleep 6
          xcrun simctl io "$DI" screenshot shot-8-live-activity.png
          ls -lh shot-8-live-activity.png
          # 锁屏那两页（实时活动锁屏视图 / 锁屏配件）要手动配置，simctl 到不了，
          # 这里只验灵动岛这一面；剩下两面的截图得真机装包手动看。

      - name: 失败时抓崩溃日志
        if: failure()
        run: |
          find ~/Library/Logs/DiagnosticReports -name "*.ips" -newermt "-15 minutes" 2>/dev/null | head -5 | while read f; do
            echo "===== $f"; head -80 "$f"
          done || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: "*.png"
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            build-sim.log
            build-sim-notch.log
            build-sim-set.log
            build-sim-kb.log
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ClawdIsland-unsigned-ipa
          path: ClawdIsland-unsigned.ipa
          retention-days: 14
