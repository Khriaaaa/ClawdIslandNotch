# XcodeGen 工程定义。
#
#   brew install xcodegen      # 或见 README 的安装方式
#   cd ClawdIsland && xcodegen generate
#
# 会生成 ClawdIsland.xcodeproj，包含两个 target：
#   ClawdIsland           —— App（@main ClawdIslandApp）
#   ClawdWidgetExtension  —— Widget 扩展（@main ClawdWidgetBundle，含灵动岛/锁屏/主屏小组件）
#
# App Group 固定为 group.com.clawd.island.clawd，两个 target 的 entitlements 里都声明了。
# 如果你改 bundle id，记得同时改这里的 entitlements、Core/ClawdStore.swift 的 appGroupID，
# 以及 Xcode 里两个 target 的 Signing & Capabilities。

name: ClawdIsland

options:
  bundleIdPrefix: com.clawd.island
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    # 注意：TARGETED_DEVICE_FAMILY 不能只写在这里。XcodeGen 的 iOS preset 会在
    # **target 级**设 `TARGETED_DEVICE_FAMILY = 1,2`，target 设置压过 project 设置 ——
    # 写在这层等于死设置，产物里仍会声明 iPad（UIDeviceFamily=[1,2]），
    # 并因只支持竖屏而多一条 orientation 警告。三个 target 各自写一遍才生效。
    # 真机跑必须有自己的 Team。命令行没配也没关系，Xcode 里选一下即可。
    # DEVELOPMENT_TEAM: XXXXXXXXXX

targets:

  ClawdIsland:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Core
      - path: Shared
      - path: Resources
      # 键盘 UI 是共享代码：扩展拿它当真键盘，App 拿同一份做预览页（CI 截图靠它）
      - path: Keyboard/Shared
      - path: Keyboard/Sprites
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Clawd Island
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 实时活动开关（BRIEF 第五节要求）
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # iOS 14+ 局域网监听/连接需要用户授权说明
        NSLocalNetworkUsageDescription: "Clawd Island 在本地网络监听外部代理推送的桌宠状态。"
        # 锁屏小组件 / 实时活动里的 widgetURL 深链（Shared/NotchDeepLink.swift）
        CFBundleURLTypes:
          - CFBundleURLName: com.clawd.island.notch
            CFBundleURLSchemes:
              - clawdisland
    entitlements:
      path: App/ClawdIsland.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.clawd.island.clawd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clawd.island
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: ClawdWidgetExtension
        embed: true
        codeSign: true
      - target: ClawdKeyboard
        embed: true
        codeSign: true

  ClawdKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard/Shared
      - path: Keyboard/Extension
      - path: Keyboard/Sprites
      # 只借这两个文件：读宿主 App 写进 App Group 的快照。
      # 不整个 Core 挂进来 —— 那会把 StateServer（Network）和 ActivityController
      # 一起编进扩展，键盘扩展内存限额只有几十 MB，而且 ActivityKit 在扩展里用不了。
      - path: Core/ClawdState.swift
      - path: Core/ClawdStore.swift
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Clawd 键盘
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            # 不写 IsASCIICapable: true。引擎确实只出 ASCII，但键盘的「中英」切换默认
            # 走全角标点（KeyboardSpec.punctText(chinese: true) 在中文态返回「。」），
            # 声明「只出 ASCII」和默认行为对不上。要么默认改半角、要么去掉这句声明 ——
            # 这里选后者：不声称做不到的事。
            PrefersRightToLeft: false
            # 引擎目前只出 ASCII（拼音引擎是另一个量级的工程）。声明 zh-Hans 会把自己
            # 塞进用户的中文输入法列表里，切过来发现打不出一个汉字，上架也留把柄。
            PrimaryLanguage: en-US
            # 想让它连状态服务器就得开完全访问；用户不授权也能用，只是只能对打字有反应
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clawd.island.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    entitlements:
      path: Keyboard/ClawdKeyboard.entitlements
      properties:
        # 键盘要读宿主 App 写进 App Group 的 Claude Code 状态。
        # 没开「完全访问」时扩展读不到共享容器，那 Clawd 就只有打字反应，其它不受影响。
        com.apple.security.application-groups:
          - group.com.clawd.island.clawd

  ClawdWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Core
      - path: Shared
      - path: Resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Clawd
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ClawdWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.clawd.island.clawd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clawd.island.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

schemes:
  ClawdIsland:
    build:
      targets:
        ClawdIsland: all
    run:
      config: Debug
    archive:
      config: Release
